  <!-- ============ CAMERA: SIGN -> TEXT ============ -->
  <section id="view-sign" class="view">
    <style>
/* ---------- camera (sign -> text) ---------- */
.cam-card { position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 52vh; margin: 8px auto; border-radius: 24px;
  overflow: hidden; background: #111; box-shadow: var(--shadow); }
.cam-card video, .cam-card canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  transform: scaleX(-1); pointer-events: none; }          /* mirrored, like looking in a mirror */
.cam-card .stage-empty { color: #ddd; }
.cam-status { position: absolute; left: 12px; top: 12px; padding: 4px 10px; border-radius: 999px;
  background: rgba(0, 0, 0, .55); color: #fff; font-size: .85rem; }
.rec-btn { background: var(--bad); color: #fff; font-weight: 600; min-width: 110px; }
.rec-btn.rec { background: #263238; }
button:disabled { opacity: .45; }
.result-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.sign-word { font-size: 2rem; font-weight: 700; }
.sign-word.unsure { color: var(--warn); }
.controls.left { justify-content: flex-start; }
.primary-chip { background: var(--primary); color: #fff; border-color: var(--primary); }
.hint { margin: 10px 0 0; font-size: .85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#signSentence { margin: 0 0 8px; font-size: 1.15rem; font-weight: 600; min-height: 1.4em; }
#signSentence.muted { font-weight: 400; color: var(--muted); }
    </style>
    <script>
      /* If camera.js does not start, say why on screen (no developer tools needed). */
      (function () {
        var errs = [];
        window.addEventListener("error", function (e) { errs.push((e.filename || "").split("/").pop() + " line " + e.lineno + ": " + e.message); });
        setTimeout(function () {
          if (window.__cameraReady) return;
          var tag = document.querySelector('script[src^="camera.js"]');
          var box = document.createElement("p");
          box.style.cssText = "margin:8px 0;padding:10px 12px;border-radius:12px;background:#fdecea;color:#8a1c1c;font-size:.9rem";
          box.textContent = !tag ? "camera.js is not included in index.html. Run: node tools\\add_camera_tab.js"
            : "camera.js did not start" + (errs.length ? ": " + errs.join(" | ") : ". Check that www\\camera.js exists, then press Ctrl+Shift+R.");
          var v = document.getElementById("view-sign"); v.insertBefore(box, v.firstChild);
          if (tag) fetch(tag.getAttribute("src"), { cache: "no-store" }).then(function (r) {
            if (!r.ok) box.textContent = "www\\camera.js was not found (HTTP " + r.status + "). Copy camera.js from the kit into the www folder.";
          }).catch(function () {});
        }, 4000);
      })();
    </script>
    <div class="cam-card">
      <video id="cam" playsinline muted autoplay></video>
      <canvas id="camDots"></canvas>
      <div id="camEmpty" class="stage-empty">Sign a word to the front camera 📷<br><small>Keep your upper body and both hands in view</small></div>
      <div id="camStatus" class="cam-status" hidden></div>
    </div>
    <div class="controls">
      <button id="camStart" class="primary">Start camera</button>
      <button id="recBtn" class="rec-btn" disabled>● Record</button>
      <div class="seg" id="modeSeg"><button data-m="hold" class="on">Hold</button><button data-m="auto">Auto</button></div>
    </div>
    <div class="sentence-card">
      <div class="result-row"><span id="signWord" class="sign-word">—</span><span id="signConf" class="muted"></span></div>
      <div id="signAlts" class="chips"></div>
    </div>
    <h3>Sentence <small id="signReady">· loading model…</small></h3>
    <div class="sentence-card">
      <p id="signSentence"></p>
      <div class="controls left">
        <button id="sentUndo" class="chip">⌫ Undo</button>
        <button id="sentClear" class="chip">Clear</button>
        <button id="sentPlay" class="chip primary-chip">🤟 Show as sign</button>
      </div>
      <p id="signHint" class="hint" hidden></p>
    </div>
  </section>
